<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>21天体态重塑训练计划</title>
<style>
:root{
  --ink:#22262e; --sub:#6b7280; --bg:#f5f6fa; --card:#fff; --line:#eceef3;
  --accent:#e5546f;
  --relax:#fdeef1; --stretch:#fbe2e7; --breath:#f9d4dd; --joint:#f7c8d2; --act:#f5aebc;
  --tipbg:#eef2f9; --tipline:#dde4f0; --green:#1fa971;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;background:var(--bg);color:var(--ink);line-height:1.65}

/* ===== Hero ===== */
.hero{background:linear-gradient(135deg,#23262f 0%,#3a3140 55%,#54323f 100%);color:#fff;padding:56px 20px 46px}
.hero-in{max-width:900px;margin:0 auto}
.kicker{font-size:12px;letter-spacing:3px;color:#f2a9bb;font-weight:700;margin-bottom:10px}
.hero h1{font-size:34px;font-weight:800;letter-spacing:1px}
.hero-sub{margin-top:10px;color:#cfd2dc;font-size:15px}
.stats{display:flex;gap:34px;margin-top:24px;flex-wrap:wrap}
.stats div{display:flex;flex-direction:column}
.stats b{font-size:30px;font-weight:800;color:#f2a9bb;line-height:1.1}
.stats span{font-size:12px;color:#aab0bd}
.equip-line{margin-top:20px;font-size:13px;color:#c3c7d1;background:rgba(255,255,255,.08);display:inline-block;padding:8px 14px;border-radius:999px}

/* ===== Sticky nav ===== */
.navbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.04)}
.nav-in{max-width:900px;margin:0 auto;padding:10px 16px;display:flex;flex-direction:column;gap:8px}
.progress-wrap{display:flex;align-items:center;gap:10px;font-size:13px}
.progress{flex:1;height:8px;background:#eceef3;border-radius:99px;overflow:hidden}
#bar{height:100%;width:0;background:linear-gradient(90deg,#e5546f,#f2a9bb);border-radius:99px;transition:width .3s}
#pcount{font-weight:700;color:var(--accent);min-width:44px;text-align:right}
button{cursor:pointer;border:none;font-family:inherit}
#continueBtn{background:var(--accent);color:#fff;padding:6px 14px;border-radius:99px;font-size:13px;font-weight:700}
#continueBtn:hover{filter:brightness(1.08)}
#resetBtn{background:none;color:var(--sub);font-size:12px;text-decoration:underline}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.days::-webkit-scrollbar{height:4px}
.days::-webkit-scrollbar-thumb{background:#d9dce4;border-radius:99px}
.dpill{flex:0 0 auto;width:34px;height:30px;border-radius:8px;background:#f1f2f7;color:#555c68;font-size:13px;font-weight:700;border:1px solid transparent}
.dpill.active{background:var(--ink);color:#fff}
.dpill.done{border-color:var(--green);color:var(--green)}
.dpill.done.active{background:var(--ink);color:#fff}

/* ===== Legend ===== */
.wrap{max-width:900px;margin:0 auto;padding:26px 16px 60px}
.legend{display:flex;flex-wrap:wrap;gap:10px 18px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:26px;font-size:13px;color:#3c4250}
.lg{display:flex;align-items:center;gap:7px}
.lg i{width:16px;height:16px;border-radius:5px;display:inline-block}

/* ===== Week headers ===== */
.week-head{margin:34px 0 14px;display:flex;align-items:center;gap:12px}
.week-head h2{font-size:20px;font-weight:800}
.week-head span{font-size:12px;color:#fff;background:var(--accent);padding:3px 10px;border-radius:99px;font-weight:700}
.week-head small{color:var(--sub);font-size:13px}

/* ===== Cards ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(30,35,50,.04);scroll-margin-top:130px;transition:box-shadow .2s, opacity .2s}
.card:hover{box-shadow:0 6px 18px rgba(30,35,50,.08)}
.card.done{opacity:.72}
.card.done .dbadge{background:var(--green)}
.card-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dbadge{background:#1c1f26;color:#fff;font-weight:800;font-size:13px;padding:5px 12px;border-radius:9px;letter-spacing:.5px}
.card-head h3{font-size:18px;font-weight:800;flex:1}
.done-btn{background:#f1f2f7;color:#555c68;border-radius:99px;padding:5px 14px;font-size:13px;font-weight:700}
.card.done .done-btn{background:#e3f6ee;color:var(--green)}
.equip{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 14px}
.eq{font-size:12px;color:#7a5a63;background:#fdf3f5;border:1px solid #f3dbe1;padding:3px 10px;border-radius:99px}
.rows{display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:118px 1fr;gap:12px;padding:10px 14px;border-radius:12px;align-items:start}
.r-relax{background:var(--relax)} .r-stretch{background:var(--stretch)} .r-breath{background:var(--breath)}
.r-joint{background:var(--joint)} .r-act{background:var(--act)}
.cat{font-weight:800;font-size:13.5px;color:#8a3a4b;line-height:1.35}
.cat small{display:block;font-weight:500;font-size:11px;color:#a05a68}
.items{display:flex;flex-wrap:wrap;gap:5px}
.it{background:#fff;border:1px solid rgba(0,0,0,.05);padding:3px 11px;border-radius:999px;font-size:13px;color:#333944}
.tip{display:flex;gap:9px;align-items:flex-start;background:var(--tipbg);border:1px solid var(--tipline);border-radius:12px;padding:10px 14px;margin-top:12px;font-size:13.5px;color:#414b63}
.tip b{color:#2c3a5e;white-space:nowrap}

footer{max-width:900px;margin:0 auto;padding:0 16px 50px;color:var(--sub);font-size:12px;text-align:center}

@media (max-width:560px){
  .row{grid-template-columns:1fr;gap:6px}
  .hero h1{font-size:26px}
  .stats{gap:22px}
}
@media print{
  .navbar,.done-btn{display:none}
  body{background:#fff}
  .card{break-inside:avoid;box-shadow:none}
  .hero{background:#333;color:#fff}
}
</style>

 ["激活强化",["俯卧挺身","俯卧高拉","YTAO"]]],tip:null}
];

const WEEKS=[{n:1,title:"第 1 周 · 觉醒与放松",range:"DAY 1–7",desc:"认识身体姿势，松解紧张筋膜，打开胸腔与肩胛",days:[1,2,3,4,5,6,7]},
{n:2,title:"第 2 周 · 激活与唤醒",range:"DAY 8–14",desc:"找到背部肌肉，建立核心稳定与力量基础",days:[8,9,10,11,12,13,14]},
{n:3,title:"第 3 周 · 强化与巩固",range:"DAY 15–21",desc:"进阶抗阻训练，重塑站姿体态，巩固成果",days:[15,16,17,18,19,20,21]}];

const CAT={"筋膜组织放松":"relax","软组织放松":"relax","软组织伸展":"stretch","呼吸引导":"breath","呼吸训练":"breath","关节灵活":"joint","脊柱灵活性":"joint","激活":"act","激活强化":"act"};

const KEY="posture21-done";
let done=new Set();
try{done=new Set(JSON.parse(localStorage.getItem(KEY)||"[]"))}catch(e){}

const weeksEl=document.getElementById("weeks"),navEl=document.getElementById("daynav");

WEEKS.forEach(w=>{
  const sec=document.createElement("section");
  sec.innerHTML=`<div class="week-head"><h2>${w.title}</h2><span>${w.range}</span><small>${w.desc}</small></div>`;
  w.days.forEach(n=>{
    const day=DATA[n-1];
    const rows=day.rows.map(r=>{
      const[cat,items,note]=r;
      const chips=items.map(i=>`<span class="it">${i}</span>`).join("");
      return `<div class="row r-${CAT[cat]}"><div class="cat">${cat}${note?`<small>${note}</small>`:""}</div><div class="items">${chips}</div></div>`;
    }).join("");
    const eqs=day.eq.map(e=>`<span class="eq">${e}</span>`).join("");
    const tip=day.tip?`<div class="tip">💡 <b>日常技巧</b><span>${day.tip}</span></div>`:"";
    sec.insertAdjacentHTML("beforeend",
`<article class="card" id="day-${n}">
  <div class="card-head"><span class="dbadge">DAY ${n}</span><h3>${day.t}</h3><button class="done-btn" data-day="${n}">✓ 完成</button></div>
  <div class="equip">${eqs}</div>
  <div class="rows">${rows}</div>
  ${tip}
</article>`);
  });
  weeksEl.appendChild(sec);
});

for(let i=1;i<=21;i++){
  const b=document.createElement("button");
  b.className="dpill";b.textContent=i;b.dataset.day=i;
  b.onclick=()=>document.getElementById("day-"+i).scrollIntoView({behavior:"smooth",block:"start"});
  navEl.appendChild(b);
}

function refresh(){
  document.getElementById("bar").style.width=(done.size/21*100)+"%";
  document.getElementById("pcount").textContent=done.size+"/21";
  document.querySelectorAll(".card").forEach(c=>c.classList.toggle("done",done.has(+c.dataset?0:+c.id.split("-")[1])));
  document.querySelectorAll(".dpill").forEach(p=>p.classList.toggle("done",done.has(+p.dataset.day)));
  try{localStorage.setItem(KEY,JSON.stringify([...done]))}catch(e){}
}

document.addEventListener("click",e=>{
  const b=e.target.closest(".done-btn");if(!b)return;
  const n=+b.dataset.day;
  done.has(n)?done.delete(n):done.add(n);
  refresh();
});

document.getElementById("resetBtn").onclick=()=>{done.clear();refresh();};
document.getElementById("continueBtn").onclick=()=>{
  const next=DATA.find(d=>!done.has(d.d));
  (next?document.getElementById("day-"+next.d):document.getElementById("day-21")).scrollIntoView({behavior:"smooth"});
};

const io=new IntersectionObserver(es=>{
  es.forEach(e=>{if(e.isIntersecting){
    document.querySelectorAll(".dpill").forEach(p=>p.classList.toggle("active",+p.dataset.day===+e.target.id.split("-")[1]));
  }});
},{rootMargin:"-30% 0px -60% 0px"});
document.querySelectorAll(".card").forEach(c=>io.observe(c));

refresh();
</script>
</body>
</html>
